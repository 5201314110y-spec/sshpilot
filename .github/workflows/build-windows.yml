name: Build Windows EXE

# Runs on every push to main, on manual trigger, and on version tags (v*).
# Tagged builds also publish a GitHub Release with the exe attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create a Release on tag builds

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          npm run build

      - name: Copy frontend build into backend
        shell: pwsh
        run: |
          if (Test-Path backend/static) { Remove-Item -Recurse -Force backend/static }
          Copy-Item -Recurse -Force frontend/dist backend/static

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package with PyInstaller
        working-directory: backend
        run: pyinstaller --noconfirm --clean sshpilot.spec

      - name: Smoke test the exe
        working-directory: backend
        shell: pwsh
        run: |
          # Launch the exe, wait for it to boot, hit /api/health, then stop it.
          $proc = Start-Process -FilePath "dist/SSHPilot.exe" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            foreach ($port in 8000..8010) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 "http://127.0.0.1:$port/api/health"
                if ($r.StatusCode -eq 200) { Write-Host "Health OK on port $port"; $ok = $true; break }
              } catch {}
            }
            if ($ok) { break }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Smoke test failed: exe did not answer /api/health" }

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHPilot-windows
          path: backend/dist/SSHPilot.exe
          if-no-files-found: error

      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/SSHPilot.exe
          generate_release_notes: true
